name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Production runs on PostgreSQL 17 (spec 0012), so the tests run on it too,
    # after the run on SQLite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: drift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drift -d drift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # 8.4.27+ patches PHP2Shell (CVE-2026-109618, CVE-2026-109619); composer.json enforces ^8.4.27.
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none
          ini-values: memory_limit=1G

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # pnpm version comes from the "packageManager" field in package.json.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Run Tests on PostgreSQL
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: drift_test
          DB_USERNAME: drift
          DB_PASSWORD: secret
