name: Build release
description: Installs the production dependencies, builds the assets for the given host and packs the app into $RUNNER_TEMP/release.tar.gz.

inputs:
  host:
    description: Public host name of the server. The browser opens its Reverb WebSocket on it.
    required: true
  reverb-app-key:
    description: REVERB_APP_KEY from the server's .env.
    required: true

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11
        cache: true

    - name: Install PHP dependencies
      shell: bash
      run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

    # Wayfinder runs artisan during the build, so the app gets the example .env; the release leaves it out.
    - name: Build assets
      shell: bash
      env:
        VITE_APP_NAME: Daily Drift
        VITE_REVERB_APP_KEY: ${{ inputs.reverb-app-key }}
        VITE_REVERB_HOST: ${{ inputs.host }}
        VITE_REVERB_PORT: '443'
        VITE_REVERB_SCHEME: https
      run: |
        cp .env.example .env
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Pack the release
      shell: bash
      run: >-
        tar -czf "$RUNNER_TEMP/release.tar.gz"
        --exclude=./.env --exclude=./.git --exclude=./.github --exclude=./node_modules
        --exclude=./storage --exclude=./tests --exclude='./database/*.sqlite*'
        .
